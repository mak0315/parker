services:
  - name: parker-api
    type: web
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: TWITTER_BEARER_TOKEN
        sync: false
      - key: FACEBOOK_ACCESS_TOKEN
        sync: false
      - key: ENABLE_SCRAPERS
        value: "true"
      - key: SCRAPING_INTERVAL
        value: "0 * * * *"

  - name: parker-dashboard
    type: web
    runtime: node
    plan: free
    buildCommand: cd client && npm install && npm run build
    startCommand: cd client && npm run preview -- --host 0.0.0.0 --port 10000
    envVars:
      - key: VITE_API_URL
        sync: false